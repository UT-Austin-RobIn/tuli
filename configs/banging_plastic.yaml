# Banging experiment — plastic cube (control condition)

experiment:
  name: banging_plastic
  seed: 1
  torch_deterministic: true
  device: cuda   # cuda or cpu

environment:
  object_type: plastic_cube   # soft_cube, plastic_cube, metal_cube
  reward_scale: 99.5           # global scale (p95 of metal calibration)
  horizon: 500
  control_freq: 20

training:
  total_timesteps: 1000000
  learning_rate: 3.0e-4
  num_envs: 1
  num_steps: 2048
  anneal_lr: true
  gamma: 0.99
  gae_lambda: 0.95
  num_minibatches: 32
  update_epochs: 10
  norm_adv: true
  clip_coef: 0.2
  clip_vloss: true
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: null

logging:
  track: true
  wandb_project: tuli
  wandb_entity: null
  capture_video: false
  save_model: true
  save_interval: 10   # save checkpoint every N iterations
